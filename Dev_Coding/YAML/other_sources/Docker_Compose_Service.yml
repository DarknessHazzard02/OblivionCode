version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: oblivion_db
    environment:
      POSTGRES_DB: oblivion_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
