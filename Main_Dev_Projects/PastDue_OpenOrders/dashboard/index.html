<!DOCTYPE html>
<!-- Made by: Hazzard -->
<html lang="es" data-theme="contoso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Due Open Orders — Contoso BI Team</title>
<link rel="stylesheet" href="estilos.css">
<script src="/shared/js/seguro.js"></script>
<script src="/shared/js/csv.js"></script>
<script src="/shared/vendor/chartjs/chart.umd.min.js"></script>
<script src="/shared/vendor/chartjs/chartjs-plugin-datalabels.min.js"></script>
<script src="/shared/vendor/xlsx/xlsx.full.min.js"></script>
</head>
<body>

<div class="app">
  <div class="banner" id="banner" role="alert" hidden></div>

  <header class="hdr">
    <a class="btn-portal" id="btnPortal" href="#">← <span data-i18n="backToPortal"></span></a>
    <h1 class="hdr__title"><span data-i18n="pageTitle"></span><small data-i18n="pageSub"></small></h1>
    <div class="hdr__chips" id="chips"></div>
    <div class="hdr__meta">
      <span><span data-i18n="updated"></span>: <b id="metaUpdated"></b></span>
      <span class="freshness" id="metaFreshness"></span>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </header>

  <nav class="tabs" id="viewTabs">
    <button data-view="resumen" data-i18n="vw_resumen"></button>
    <button data-view="tendencias" data-i18n="vw_tendencias"></button>
    <button data-view="razones" data-i18n="vw_razones"></button>
    <button data-view="bridge" data-i18n="vw_bridge"></button>
    <button data-view="manual" data-i18n="vw_manual"></button>
  </nav>

  <div class="app__body">
    <aside class="filter-panel" id="filterPanel">
      <div class="filter-panel__rail">
        <button class="filter-panel__toggle rail__btn" id="btnFilterOpen">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M3 5.5h18a1 1 0 0 1 .8 1.6l-6.3 8v5.2a1 1 0 0 1-1.45.9l-3.5-1.75a1 1 0 0 1-.55-.9v-3.45l-6.3-8A1 1 0 0 1 3 5.5z"
                  fill="currentColor"/>
          </svg>
          <span class="rail__txt" data-i18n="filters"></span>
        </button>
        <span class="filter-badge" id="filterBadge" hidden>0</span>
      </div>
      <div class="filter-panel__body">
        <div class="card__header">
          <strong data-i18n="filters"></strong>
          <button class="filter-panel__toggle" id="btnFilterClose">✕</button>
        </div>
        <!-- Alcance -> categorias cortas -> largas -->
        <div class="filter-group" data-field="division"></div>
        <div class="filter-group" data-field="pd"></div>
        <div class="filter-group" data-field="sitio"></div>
        <div class="filter-group" data-field="razon_sitio"></div>
        <div class="filter-group" data-field="on_hold"></div>
        <div class="filter-group" data-field="rango"></div>
        <div class="filter-group" data-field="org"></div>
        <div class="filter-group" data-field="resp"></div>
        <div class="filter-group" data-field="prodline_sales"></div>
        <div class="filter-group" data-field="cliente"></div>
        <div class="filter-clear">
          <button class="btn-export" id="btnClear" style="width:100%">
            <span data-i18n="clearFilters"></span>
          </button>
        </div>
      </div>
    </aside>

    <main class="app__main">
      <div class="loading" id="loading" data-i18n="loading"></div>

      <div class="toolbar">
        <span class="toolbar__label" data-i18n="alcance"></span>
        <div class="seg" id="scopeToggle">
          <button class="seg__btn" data-scope="pd" data-i18n="scopePd"></button>
          <button class="seg__btn" data-scope="todas" data-i18n="scopeTodas"></button>
        </div>
        <span class="toolbar__info" id="toolbarInfo"></span>
      </div>

      <section class="grid kpi-row" id="kpiRow" style="margin-bottom:var(--grid-gap)"></section>

      <!-- ===== Resumen ejecutivo ===== -->
      <section class="grid view" data-view="resumen">
        <div class="card span-7" id="cardSitioTabla">
          <div class="card__header"><h3 class="card__title" data-i18n="v_sitioTabla"></h3></div>
          <p class="card__sub" data-i18n="v_sitioTabla_sub"></p>
          <div class="tbl-wrap"><table class="tbl tbl--compacta" id="tblSitio"></table></div>
        </div>
        <div class="card span-5" id="cardRazonSitio">
          <div class="card__header"><h3 class="card__title" data-i18n="v_razonSitio"></h3></div>
          <p class="card__sub" data-i18n="v_razonSitio_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chRazonSitio"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
        <div class="card span-12" id="cardFechas">
          <div class="card__header"><h3 class="card__title" data-i18n="v_fechas"></h3></div>
          <p class="card__sub" data-i18n="v_fechas_sub"></p>
          <div class="chart-box"><canvas id="chFechas"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
      </section>

      <!-- ===== Tendencias ===== -->
      <section class="grid view" data-view="tendencias" hidden>
        <div class="card span-12" id="cardDiaria">
          <div class="card__header"><h3 class="card__title" data-i18n="v_diaria"></h3><span class="tag-manual" data-i18n="tagManual"></span></div>
          <p class="card__sub" data-i18n="v_diaria_sub"></p>
          <div class="chart-box"><canvas id="chDiaria"></canvas><div class="empty-state" hidden data-i18n="noHist"></div></div>
        </div>
        <div class="card span-6" id="cardUnDia">
          <div class="card__header"><h3 class="card__title" data-i18n="v_unDia"></h3><span class="tag-manual" data-i18n="tagManual"></span></div>
          <p class="card__sub" data-i18n="v_unDia_sub"></p>
          <div class="chart-box"><canvas id="chUnDia"></canvas><div class="empty-state" hidden data-i18n="noHist"></div></div>
        </div>
        <div class="card span-6" id="cardMensual">
          <div class="card__header"><h3 class="card__title" data-i18n="v_mensual"></h3><span class="tag-manual" data-i18n="tagManual"></span></div>
          <p class="card__sub" data-i18n="v_mensual_sub"></p>
          <div class="chart-box"><canvas id="chMensual"></canvas><div class="empty-state" hidden data-i18n="noHist"></div></div>
        </div>
        <div class="card span-6" id="cardHold">
          <div class="card__header"><h3 class="card__title" data-i18n="v_hold"></h3></div>
          <p class="card__sub" data-i18n="v_hold_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chHold"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
        <div class="card span-6" id="cardPlantaDiv">
          <div class="card__header"><h3 class="card__title" data-i18n="v_plantaDiv"></h3></div>
          <p class="card__sub" data-i18n="v_plantaDiv_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chPlantaDiv"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
      </section>

      <!-- ===== Razones y familias ===== -->
      <section class="grid view" data-view="razones" hidden>
        <div class="card span-5" id="cardCategoria">
          <div class="card__header"><h3 class="card__title" data-i18n="v_categoria"></h3></div>
          <p class="card__sub" data-i18n="v_categoria_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chCategoria"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
        <div class="card span-7" id="cardRazon">
          <div class="card__header"><h3 class="card__title" data-i18n="v_razon"></h3></div>
          <p class="card__sub" data-i18n="v_razon_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chRazon"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
        <div class="card span-7" id="cardFamilia">
          <div class="card__header"><h3 class="card__title" data-i18n="v_familia"></h3></div>
          <p class="card__sub" data-i18n="v_familia_sub"></p>
          <div class="chart-box chart-box--familias"><canvas id="chFamilia"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
        <div class="card span-5" id="cardRango">
          <div class="card__header"><h3 class="card__title" data-i18n="v_rango"></h3></div>
          <p class="card__sub" data-i18n="v_rango_sub"></p>
          <div class="chart-box"><canvas id="chRango"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
      </section>

      <!-- ===== Bridge ===== -->
      <section class="grid view" data-view="bridge" hidden>
        <div class="card span-12 nota-manual">
          <b data-i18n="manualTitle"></b> <span data-i18n="bridgeManual"></span>
        </div>
        <div class="card span-7" id="cardBridge">
          <div class="card__header"><h3 class="card__title" data-i18n="v_bridge"></h3><span class="tag-manual" data-i18n="tagManual"></span></div>
          <p class="card__sub" data-i18n="v_bridge_sub"></p>
          <div class="tbl-wrap"><table class="tbl tbl--compacta" id="tblBridge"></table></div>
        </div>
        <div class="card span-5" id="cardBridgeCh">
          <div class="card__header"><h3 class="card__title" data-i18n="v_bridgeCh"></h3></div>
          <p class="card__sub" data-i18n="v_bridgeCh_sub"></p>
          <div class="chart-box chart-box--alto"><canvas id="chBridge"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
        </div>
      </section>

      <!-- ===== Ajustes manuales ===== -->
      <section class="grid view" data-view="manual" hidden>
        <div class="card span-12 nota-manual">
          <b data-i18n="manualTitle"></b> <span data-i18n="manualDetail"></span>
        </div>
        <div class="card span-5" id="cardFuentesMan">
          <div class="card__header"><h3 class="card__title" data-i18n="v_fuentesMan"></h3></div>
          <p class="card__sub" data-i18n="v_fuentesMan_sub"></p>
          <div class="tbl-wrap"><table class="tbl tbl--compacta" id="tblFuentesMan"></table></div>
        </div>
        <div class="card span-7" id="cardAjustes">
          <div class="card__header"><h3 class="card__title" data-i18n="v_ajustes"></h3><span class="tag-manual" data-i18n="tagManual"></span></div>
          <p class="card__sub" data-i18n="v_ajustes_sub"></p>
          <div class="tbl-wrap"><table class="tbl tbl--compacta" id="tblAjustes"></table></div>
        </div>
      </section>

      <section class="card" id="detailCard" style="margin-top:var(--grid-gap)">
        <div class="card__header">
          <h3 class="card__title"><span data-i18n="detail"></span></h3>
          <div class="detail-tools">
            <label class="pager__size"><span data-i18n="vistaDetalle"></span>
              <select id="presetSel"></select></label>
            <input type="search" class="tbl-buscar" id="tblBuscar">
            <span class="btn-export__count" id="rowCount"></span>
            <button class="btn-export" id="btnCopyPn">⧉ <span data-i18n="copy_all"></span></button>
            <button class="btn-export" id="btnCsv">⤓ CSV</button>
            <button class="btn-export" id="btnXlsx">⤓ Excel</button>
          </div>
        </div>
        <p class="card__sub" id="presetSub"></p>
        <div class="tbl-wrap">
          <table class="tbl" id="detailTable">
            <thead><tr id="detailHead"></tr></thead>
            <tbody id="detailBody"></tbody>
            <tfoot id="detailFoot"></tfoot>
          </table>
        </div>
        <div class="pager">
          <span class="pager__info">
            <span id="pagerRange"></span>
            <label class="pager__size"><span data-i18n="rowsPerPage"></span>
              <select id="pageSize"></select></label>
          </span>
          <div class="pager__pages" id="pagerPages"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="ftr">
    <span class="ftr__credit">Contoso BI Team · Contoso Motors Americas</span>
    <span>
      <span data-i18n="source"></span>: <span id="ftrSources"></span> ·
      <span data-i18n="updated"></span>: <span id="ftrUpdated"></span>
    </span>
    <span>
      <button class="btn-export btn-diag" id="btnDiag" data-i18n="diag"></button>
      <button class="btn-export" id="btnDoc">📖 <span data-i18n="documentation"></span></button>
    </span>
  </footer>
</div>

<div class="doc-overlay" id="docOverlay" hidden></div>
<aside class="doc-panel" id="docPanel">
  <div class="doc-panel__hdr">
    <strong id="docTitle" data-i18n="documentation"></strong>
    <button class="filter-panel__toggle" id="btnDocClose" style="color:inherit">✕</button>
  </div>
  <div class="doc-panel__body" id="docBody"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true">
    <div class="card__header">
      <h3 class="card__title" id="modalTitle"></h3>
      <button class="filter-panel__toggle" id="btnModalClose">✕</button>
    </div>
    <p class="card__sub" data-i18n="m_sub"></p>
    <div class="modal__grid" id="modalGrid"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
