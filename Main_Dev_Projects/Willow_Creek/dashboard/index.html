<!DOCTYPE html>
<!-- Made by: Hazzard -->
<html lang="es" data-theme="contoso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willow Creek Order Control — Contoso BI Team</title>
<link rel="stylesheet" href="estilos.css">
<script src="/shared/js/seguro.js"></script>
<script src="/shared/js/csv.js"></script>
<script src="/shared/vendor/chartjs/chart.umd.min.js"></script>
<script src="/shared/vendor/chartjs/chartjs-plugin-datalabels.min.js"></script>
<script src="/shared/vendor/xlsx/xlsx.full.min.js"></script>
</head>
<body>

<div class="app">
  <div class="banner" id="banner" role="alert" hidden></div>

  <header class="hdr">
    <a class="btn-portal" id="btnPortal" href="#">← <span data-i18n="backToPortal"></span></a>
    <h1 class="hdr__title"><span data-i18n="pageTitle"></span><small data-i18n="pageSub"></small></h1>
    <div class="hdr__chips" id="chips"></div>
    <div class="hdr__meta">
      <span><span data-i18n="updated"></span>: <b id="metaUpdated"></b></span>
      <span class="freshness" id="metaFreshness"></span>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </header>

  <div class="app__body">
    <aside class="filter-panel" id="filterPanel">
      <div class="filter-panel__rail">
        <button class="filter-panel__toggle rail__btn" id="btnFilterOpen">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M3 5.5h18a1 1 0 0 1 .8 1.6l-6.3 8v5.2a1 1 0 0 1-1.45.9l-3.5-1.75a1 1 0 0 1-.55-.9v-3.45l-6.3-8A1 1 0 0 1 3 5.5z"
                  fill="currentColor"/>
          </svg>
          <span class="rail__txt" data-i18n="filters"></span>
        </button>
        <span class="filter-badge" id="filterBadge" hidden>0</span>
      </div>
      <div class="filter-panel__body">
        <div class="card__header">
          <strong data-i18n="filters"></strong>
          <button class="filter-panel__toggle" id="btnFilterClose">✕</button>
        </div>
        <!-- Alcance -> Periodo -> categorias cortas -> largas; los grupos los arma app.js por pestana -->
        <div id="grupoAlcance"></div>
        <div class="filter-group" id="grupoFechas">
          <div class="filter-group__label"><span id="fechasLabel"></span></div>
          <div class="filter-fechas">
            <label for="fDesde" data-i18n="desde"></label><input type="date" id="fDesde">
            <label for="fHasta" data-i18n="hasta"></label><input type="date" id="fHasta">
          </div>
          <div class="filter-nota" id="fechasNota"></div>
        </div>
        <div id="grupoResto"></div>
        <div class="filter-clear">
          <button class="btn-export" id="btnClear" style="width:100%">
            <span data-i18n="clearFilters"></span>
          </button>
        </div>
      </div>
    </aside>

    <main class="app__main">
      <div class="loading" id="loading" data-i18n="loading"></div>

      <nav class="tabs tabs--main" id="tabs">
        <button data-tab="ordenes"><span data-i18n="tab_ordenes"></span><span class="tabs__n" id="nTab_ordenes"></span></button>
        <button data-tab="sap"><span data-i18n="tab_sap"></span><span class="tabs__n" id="nTab_sap"></span></button>
        <button data-tab="archivos"><span data-i18n="tab_archivos"></span><span class="tabs__n" id="nTab_archivos"></span></button>
      </nav>

      <!-- ============ ORDENES DE WC ============ -->
      <section class="tab-pane" data-pane="ordenes">
        <div class="toolbar"><span class="toolbar__info" id="infoOrdenes"></span></div>
        <div class="kpi-row" id="kpi_ordenes"></div>
        <div class="grid">
          <div class="card span-5" id="card_chCategoria">
            <div class="card__header"><h3 class="card__title" data-i18n="v_categoria"></h3></div>
            <div class="chart-box"><canvas id="chCategoria"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
          <div class="card span-7" id="card_chHallazgos">
            <div class="card__header"><h3 class="card__title" data-i18n="v_hallazgos"></h3></div>
            <p class="card__sub" data-i18n="v_hallazgos_sub"></p>
            <div class="chart-box chart-box--hallazgos"><canvas id="chHallazgos"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
          <div class="card span-6" id="card_chMes">
            <div class="card__header"><h3 class="card__title" data-i18n="v_mes"></h3></div>
            <p class="card__sub" data-i18n="v_mes_sub"></p>
            <div class="chart-box"><canvas id="chMes"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
          <div class="card span-6" id="card_chCliente">
            <div class="card__header"><h3 class="card__title" data-i18n="v_cliente"></h3></div>
            <p class="card__sub" data-i18n="v_cliente_sub"></p>
            <div class="chart-box"><canvas id="chCliente"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
        </div>
      </section>

      <!-- ============ SAP SIN WC ============ -->
      <section class="tab-pane" data-pane="sap" hidden>
        <div class="toolbar"><span class="toolbar__info" id="infoSap"></span></div>
        <div class="kpi-row" id="kpi_sap"></div>
        <div class="grid">
          <div class="card span-6" id="card_chSapCliente">
            <div class="card__header"><h3 class="card__title" data-i18n="v_sapCliente"></h3></div>
            <div class="chart-box"><canvas id="chSapCliente"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
          <div class="card span-6" id="card_chSapPor">
            <div class="card__header"><h3 class="card__title" data-i18n="v_sapPor"></h3></div>
            <div class="chart-box"><canvas id="chSapPor"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
        </div>
      </section>

      <!-- ============ REPORTES RECIBIDOS ============ -->
      <section class="tab-pane" data-pane="archivos" hidden>
        <div class="card respuesta" id="respuestaArchivo" style="margin-bottom:var(--grid-gap)">
          <div class="respuesta__body">
            <span class="respuesta__titulo" id="respTitulo"></span>
            <span class="respuesta__detalle" id="respDetalle"></span>
          </div>
        </div>
        <div class="kpi-row" id="kpi_archivos"></div>
        <div class="grid">
          <div class="card span-12" id="card_chArchivos">
            <div class="card__header"><h3 class="card__title" data-i18n="v_archivos"></h3></div>
            <p class="card__sub" data-i18n="v_archivos_sub"></p>
            <div class="chart-box"><canvas id="chArchivos"></canvas><div class="empty-state" hidden data-i18n="noData"></div></div>
          </div>
        </div>
      </section>

      <section class="card" id="detailCard" style="margin-top:var(--grid-gap)">
        <div class="card__header">
          <h3 class="card__title" id="detailTitle"></h3>
          <div class="detail-tools">
            <input type="search" class="tbl-buscar" id="tblBuscar">
            <span class="btn-export__count" id="rowCount"></span>
            <button class="btn-export" id="btnCsv">⤓ CSV</button>
            <button class="btn-export" id="btnXlsx">⤓ Excel</button>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl" id="detailTable">
            <thead><tr id="detailHead"></tr></thead>
            <tbody id="detailBody"></tbody>
            <tfoot id="detailFoot"></tfoot>
          </table>
        </div>
        <div class="pager">
          <span class="pager__info">
            <span id="pagerRange"></span>
            <label class="pager__size"><span data-i18n="rowsPerPage"></span>
              <select id="pageSize"></select></label>
          </span>
          <div class="pager__pages" id="pagerPages"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="ftr">
    <span class="ftr__credit">Contoso BI Team · Contoso Motors Americas</span>
    <span>
      <span data-i18n="source"></span>: <span id="ftrSources"></span> ·
      <span data-i18n="updated"></span>: <span id="ftrUpdated"></span>
    </span>
    <span>
      <button class="btn-export btn-diag" id="btnDiag" data-i18n="diag"></button>
      <button class="btn-export" id="btnDoc">📖 <span data-i18n="documentation"></span></button>
    </span>
  </footer>
</div>

<div class="doc-overlay" id="docOverlay" hidden></div>
<aside class="doc-panel" id="docPanel">
  <div class="doc-panel__hdr">
    <strong id="docTitle" data-i18n="documentation"></strong>
    <button class="filter-panel__toggle" id="btnDocClose" style="color:inherit">✕</button>
  </div>
  <div class="doc-panel__body" id="docBody"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true">
    <div class="card__header">
      <h3 class="card__title" id="modalTitle"></h3>
      <button class="filter-panel__toggle" id="btnModalClose">✕</button>
    </div>
    <div class="modal__grid" id="modalGrid"></div>
    <div id="modalHallazgos"></div>
    <p class="card__sub" style="margin-top:var(--sp-3)" data-i18n="m_intentos"></p>
    <div class="tbl-wrap"><table class="tbl" id="modalTabla"></table></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
