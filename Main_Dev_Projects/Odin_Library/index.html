<!DOCTYPE html>
<!-- Made by: Hazzard -->
<!-- The Odin Project - Full Stack JavaScript: Library (objects, constructors, prototypes). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>My <span>Library</span></h1>
    <button id="new-book" class="btn">+ New book</button>
  </header>
  <p id="summary" class="summary"></p>
  <main id="shelf" class="shelf" aria-live="polite"></main>

  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2>Add a book</h2>
      <label>Title <input name="title" required maxlength="120" pattern=".*\S.*" title="Type at least one letter or number."></label>
      <label>Author <input name="author" required maxlength="80" pattern=".*\S.*" title="Type at least one letter or number."></label>
      <label>Pages <input name="pages" type="number" min="1" max="10000" required></label>
      <label class="check"><input name="read" type="checkbox"> I have read it</label>
      <div class="actions">
        <button type="button" id="cancel" class="btn btn--ghost">Cancel</button>
        <button type="submit" class="btn">Add</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
